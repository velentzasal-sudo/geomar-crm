name: Deploy Logi-Smart

on:
  push:
    branches: [main]
    paths:
      - 'logismart/**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logismart/package-lock.json

      - name: Install dependencies
        working-directory: logismart
        run: npm ci

      - name: Build
        working-directory: logismart
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: logismart/dist
          destination_dir: logismart
          keep_files: true
